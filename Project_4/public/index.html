<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textile Store - Frontend Integration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <h1>Textile Store</h1>
                <ul class="nav-links">
                    <li><a href="#products" onclick="loadProducts()">Products</a></li>
                    <li><a href="#inquiries" onclick="loadInquiries()">Inquiries</a></li>
                    <li><a href="#contact" onclick="scrollToContact()">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container">
        <!-- Hero Section -->
        <section class="hero">
            <h2>Welcome to Our Textile Store</h2>
            <p>Explore our premium collection of textiles</p>
        </section>

        <!-- Products Section -->
        <section id="products" class="section">
            <h2>Products</h2>
            <div class="controls">
                <button class="btn btn-primary" onclick="loadProducts()">Load Products</button>
                <button class="btn btn-secondary" onclick="toggleProductForm()">Add Product</button>
            </div>

            <!-- Product Form (Hidden by default) -->
            <div id="productForm" class="form-container" style="display: none;">
                <h3>Add New Product</h3>
                <form onsubmit="submitProduct(event)">
                    <input type="text" id="productName" placeholder="Product Name" required>
                    <textarea id="productDesc" placeholder="Description" required></textarea>
                    <input type="number" id="productPrice" placeholder="Price" step="0.01" required>
                    <input type="text" id="productCategory" placeholder="Category" required>
                    <input type="text" id="productImage" placeholder="Image URL">
                    <button type="submit" class="btn btn-success">Submit</button>
                    <button type="button" class="btn btn-danger" onclick="toggleProductForm()">Cancel</button>
                </form>
            </div>

            <!-- Products Display -->
            <div id="productsContainer" class="products-grid">
                <p class="loading">Loading products...</p>
            </div>
        </section>

        <!-- Inquiries Section -->
        <section id="inquiries" class="section">
            <h2>Inquiries</h2>
            <div class="controls">
                <button class="btn btn-primary" onclick="loadInquiries()">Load Inquiries</button>
            </div>

            <!-- Inquiries Display -->
            <div id="inquiriesContainer" class="inquiries-list">
                <p class="loading">Loading inquiries...</p>
            </div>
        </section>

        <!-- Contact Section -->
        <section id="contact" class="section contact-section">
            <h2>Send Inquiry</h2>
            <form onsubmit="submitInquiry(event)" class="inquiry-form">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" placeholder="Your Name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="Your Email" required>
                </div>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" placeholder="Your Message" rows="5" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Submit Inquiry</button>
            </form>
        </section>
    </main>

    <!-- Alert Section -->
    <div id="alertBox" class="alert-box"></div>

    <footer>
        <p>&copy; 2024 Textile Store. All rights reserved.</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
